<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img"><title>Zero-copy versus copied KV: decode throughput and transfer latency</title><desc>Copied versus zero-copy medians across three retained workloads. Short decode22.48 versus20.49 tokens per second; longer runs show no sustained gain. Individual observations and ranges shown.</desc><rect width="100%" height="100%" fill="#f5f8fb"/><g font-family="DejaVu Sans,Arial,sans-serif">
<text x="42" y="56" font-size="34" fill="#173047" font-weight="700">Zero-copy: what changed in tok/s?</text>
<text x="42" y="92" font-size="17" fill="#526878" font-weight="400">Copied KV → shared (zero-copy) KV · Intel i5-1340P / Iris Xe · Gemma E4B Q4 + MTP3</text>
<rect x="42" y="116" width="1120" height="85" rx="8" fill="#e5f1ec"/>
<text x="62" y="149" font-size="23" fill="#13795b" font-weight="700">Short run: +1.99 tok/s (+9.72%). Longer runs: no decode gain.</text>
<text x="62" y="180" font-size="18" fill="#173047" font-weight="400">At 4K, zero-copy saves 63.85 ms in handoff while decode remains about 20.7 tok/s.</text>
