<text x="52" y="1234" font-size="23" fill="#173047" font-weight="700">How to read this</text>
<text x="52" y="1264" font-size="16" fill="#173047" font-weight="400">Decode rate = (outputs − 1) / (last token time − first token time); startup/prefill excluded.</text>
<text x="52" y="1294" font-size="16" fill="#173047" font-weight="400">Output and MTP work match within each workload. Numeric-sequence task favours MTP;</text>
<text x="52" y="1320" font-size="16" fill="#173047" font-weight="400">these are not coding-agent tok/s results. Ranges overlap; the short-run gain did not persist.</text>
<text x="52" y="1350" font-size="16" fill="#526878" font-weight="400">Retained 13 Sep measurements, before later batching/Q6 changes. No latest-master claim.</text>
<text x="52" y="1380" font-size="16" fill="#526878" font-weight="400">Copied control is RAM handoff, not file I/O. One contended run and both profiles excluded.</text>
<text x="42" y="1438" font-size="14" fill="#526878" font-weight="400">Verified from 16 raw runs; no benchmark reruns · source hashes and per-run CSV included</text>
