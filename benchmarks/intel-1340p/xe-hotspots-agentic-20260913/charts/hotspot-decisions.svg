<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>Hotspot experiments: retained gains and rejected defaults</title><desc>CPU and Vulkan kernels have separate axes; synthetic gains are not model speedups.</desc><rect width="100%" height="100%" fill="#f6f8fb"/><g font-family="DejaVu Sans,Arial,sans-serif">
<text x="48" y="54" font-size="29" fill="#172d40" font-weight="700">Hotspot experiments: gains and rejected defaults</text>
<text x="48" y="87" font-size="16" fill="#526778" font-weight="400">Synthetic operator time changes versus matched controls · lower is better</text>
<rect x="38" y="113" width="1124" height="325" rx="10" fill="#fff"/>
<text x="60" y="149" font-size="22" fill="#172d40" font-weight="700">CPU: Q4 alternatives and Q6 paired projection</text>
<text x="60" y="176" font-size="14" fill="#526778" font-weight="400">Q4: 8-thread confirmation, 18 correctness cases. Q6: full 262144 × 4 × 2560 shape.</text>
<line x1="570" x2="570" y1="190" y2="414" stroke="#e2e8ef"/>
<text x="558" y="430" font-size="12" fill="#526778" font-weight="400">-15%</text>
<line x1="650" x2="650" y1="190" y2="414" stroke="#e2e8ef"/>
<text x="638" y="430" font-size="12" fill="#526778" font-weight="400">-10%</text>
<line x1="730" x2="730" y1="190" y2="414" stroke="#e2e8ef"/>
<text x="718" y="430" font-size="12" fill="#526778" font-weight="400">-5%</text>
<line x1="810" x2="810" y1="190" y2="414" stroke="#9caab8"/>
<text x="798" y="430" font-size="12" fill="#526778" font-weight="400">0%</text>
<line x1="890" x2="890" y1="190" y2="414" stroke="#e2e8ef"/>
<text x="878" y="430" font-size="12" fill="#526778" font-weight="400">5%</text>
<line x1="970" x2="970" y1="190" y2="414" stroke="#e2e8ef"/>
<text x="958" y="430" font-size="12" fill="#526778" font-weight="400">10%</text>
<line x1="1050" x2="1050" y1="190" y2="414" stroke="#e2e8ef"/>
<text x="1038" y="430" font-size="12" fill="#526778" font-weight="400">15%</text>
<text x="60" y="215" font-size="16" fill="#172d40" font-weight="400">Q4 family 0 · 10240 × 4 × 2560</text>
<rect x="810" y="199" width="118.17900472023197" height="21" rx="3" fill="#b54738"/>
<text x="1090" y="215" font-size="14" fill="#b54738" font-weight="600">+7.39%</text>
<text x="60" y="257" font-size="16" fill="#172d40" font-weight="400">Q4 family 0 · 2560 × 4 × 10240</text>
<rect x="810" y="241" width="104.84603338714464" height="21" rx="3" fill="#b54738"/>
<text x="1090" y="257" font-size="14" fill="#b54738" font-weight="600">+6.55%</text>
<text x="60" y="299" font-size="16" fill="#172d40" font-weight="400">Q4 family 1 · 10240 × 4 × 2560</text>
<rect x="777.2724306957504" y="283" width="32.72756930424965" height="21" rx="3" fill="#147d64"/>
<text x="1090" y="299" font-size="14" fill="#147d64" font-weight="600">-2.05%</text>
<text x="60" y="341" font-size="16" fill="#172d40" font-weight="400">Q4 family 1 · 2560 × 4 × 10240</text>
<rect x="810" y="325" width="195.73614312953003" height="21" rx="3" fill="#b54738"/>
<text x="1090" y="341" font-size="14" fill="#b54738" font-weight="600">+12.23%</text>
<text x="60" y="383" font-size="16" fill="#172d40" font-weight="400">Q6 paired projection · full shape</text>
<rect x="622.8188647223062" y="367" width="187.18113527769376" height="21" rx="3" fill="#147d64"/>
<text x="1090" y="383" font-size="14" fill="#147d64" font-weight="600">-11.70%</text>
<rect x="38" y="460" width="1124" height="244" rx="10" fill="#fff"/>
<text x="60" y="496" font-size="22" fill="#172d40" font-weight="700">Vulkan: 128 × 128 large tile rejected</text>
<text x="60" y="523" font-size="14" fill="#526778" font-weight="400">Same O1 plugin, untraced ABBA; two processes per arm. Default medium 64 × 64 retained.</text>
<text x="60" y="563" font-size="17" fill="#172d40" font-weight="400">10240 × 256 × 2560</text>
<rect x="470" y="545" width="450.6452465181077" height="23" rx="3" fill="#b54738"/>
<text x="955" y="563" font-size="18" fill="#b54738" font-weight="700">+250.36%</text>
<text x="470" y="583" font-size="14" fill="#526778" font-weight="400">5.441 → 19.062 ms</text>
<text x="60" y="622" font-size="17" fill="#172d40" font-weight="400">2560 × 256 × 10240</text>
<rect x="470" y="604" width="406.4395493686102" height="23" rx="3" fill="#b54738"/>
<text x="955" y="622" font-size="18" fill="#b54738" font-weight="700">+225.80%</text>
<text x="470" y="642" font-size="14" fill="#526778" font-weight="400">5.782 → 18.837 ms</text>
<text x="60" y="686" font-size="14" fill="#526778" font-weight="400">Both shapes pass finite/NMSE ≈ 2.2e-7. Shared-memory fit alone did not improve throughput.</text>
<text x="48" y="751" font-size="16" fill="#172d40" font-weight="400">Q4 loses in 3/4 groups: no default change; smaller two-thread opportunity retained.</text>
<text x="48" y="780" font-size="16" fill="#172d40" font-weight="400">Q6 remains opt-in. Kernel percentages are separate from measured whole-workflow results.</text>
<text x="48" y="817" font-size="14" fill="#526778" font-weight="400">All failures retained. Zero swap and worker cleanup verified in admitted runs. No deployment.</text>
</g></svg>
